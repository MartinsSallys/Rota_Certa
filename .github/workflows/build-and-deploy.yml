name: "RotaCerta CI"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Install deps"
        run: pip install python-docx
      - name: "Validate index.html"
        run: |
          python3 -c "
          with open('Rota_Certa/index.html') as f:
              html = f.read()
          assert '<title>' in html, 'Missing title tag'
          print('HTML ok')
      - name: "Install LibreOffice (opcional)"
        run: |
          sudo apt-get update && sudo apt-get install -y libreoffice